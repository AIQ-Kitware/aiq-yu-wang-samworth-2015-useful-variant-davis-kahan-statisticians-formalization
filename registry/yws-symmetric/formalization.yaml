# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Palomar entry metadata for `registry/yws-symmetric/comparator.json`.
#
# One Palomar entry is one Comparator configuration, so this file describes the
# symmetric Yu-Wang-Samworth selection -- Theorem 2 and Corollary 1 -- and not
# the whole repository. The rectangular Theorem 3 entry has its own metadata
# beside its own configuration, because its relationship to the source differs.
version: "v0.4"

project:
  name: "Yu-Wang-Samworth 2015: Theorem 2 and Corollary 1, the population-gap Davis-Kahan bounds"
  description: >-
    A machine-checked formalization, in Lean 4, of Theorem 2 and Corollary 1 of
    Yi Yu, Tengyao Wang and Richard J. Samworth, "A useful variant of the
    Davis-Kahan theorem for statisticians" (Biometrika 102 (2015) 315-323).

    The classical Davis-Kahan sin-Theta bound divides the perturbation by a
    separation between the population eigenvalues inside a selected block and the
    sample eigenvalues outside it. That quantity mixes the two spectra, so it is
    random and unobserved, and it can vanish while the population spectrum is
    well separated: the article's own illustration takes Sigma =
    diag(50,40,30,20,10) and Sigma-hat = diag(54,37,32,23,21) at the eigenvectors
    of the second, third and fourth largest eigenvalues, where the classical
    separation is zero and the population gap is 10. Yu, Wang and Samworth show
    that the separation may instead be taken entirely inside the population
    spectrum, and improve the numerator from the Frobenius norm of the
    perturbation to min(sqrt(d) ||E||_op, ||E||_F).

    Four declarations are compared. Theorem 2's first conclusion bounds the
    Frobenius sin-Theta distance between the population and sample eigenspaces of
    a block r..s of a real symmetric p-by-p matrix by 2 min(sqrt(d) ||E||_op,
    ||E||_F) / Delta, with Delta = min(lambda_{r-1} - lambda_r, lambda_s -
    lambda_{s+1}); its second conclusion produces an orthogonal d-by-d matrix
    O-hat with ||V-hat O-hat - V||_F at most 2^(3/2) times the same quotient,
    compared against the supplied population frame. Corollary 1 is the rank-one
    case, with the two printed displays and the printed orientation condition.

    The gap and separation hypotheses involve only the population operator: no
    sample eigengap appears in any of the four compared statements. The sample
    matrix may therefore have a repeated eigenvalue at the selected block, where
    its eigenframe is not determined, and the statements quantify over every
    admissible orthonormal sample eigenframe rather than over one chosen
    eigenbasis. Delta is identified with the source's denominator rather than
    merely bounded below by it, with one documented exception: when the selected
    block is the whole spectrum the source conventions make both exterior gaps
    infinite, and the Challenge records that as an explicit branch in which every
    positive finite Delta is admissible because the sine distance is then zero.

    The wider development from which this entry is extracted also formalizes the
    paper's Theorem 1, its Theorem 3 for singular subspaces of rectangular
    matrices, Appendix Lemma A1, both Section 2 sharpness constructions, the
    Section 1 numerical illustration and the deterministic content of the Section
    3 audit, and machine-checks three defects in the printed paper. Those are not
    part of this Comparator configuration; the Theorem 3 selection is a separate
    Palomar entry with its own metadata.
  authors:
    - "Jon Crall"
    - "Edward Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jon Crall"

classification:
  arxiv: ["math.ST", "math.FA"]
  msc2020:
    - "62H25"   # Factor analysis, principal components, correspondence analysis
    - "47A55"   # Perturbation theory of linear operators
    - "15A42"   # Inequalities involving eigenvalues and singular values
    - "65F15"   # Numerical computation of eigenvalues and eigenvectors

sources:
  - title: "A useful variant of the Davis-Kahan theorem for statisticians"
    authors: ["Yi Yu", "Tengyao Wang", "Richard J. Samworth"]
    id: "doi:10.1093/biomet/asv008"
    type: "paper"
    location: "Biometrika 102(2), 2015, 315-323"
    relationship: "formalizes"
    note: >-
      Published Biometrika numbering; the 2014 arXiv preprint numbers the same
      results differently and states Theorem 1's exterior rays with different
      indices. The four compared declarations are Theorem 2's two conclusions and
      Corollary 1's two displays. Theorem 2's two conclusions are at the printed
      statement with no added hypothesis and no weakened conclusion. Corollary 1's
      two displays make explicit the unit normalization inherited from its
      derivation as the d = 1 case of Theorem 2, which the standalone printed
      display omits; that is the only place where these four statements are not
      verbatim the printed ones, and it is spelled out below. All four have no
      sample eigengap, an arbitrary admissible sample eigenframe, the printed
      constants 2 and 2^(3/2), and the printed denominator identified rather than
      bounded below (see the Challenge
      docstring for the full-block endpoint case, which is the one place where a
      positive finite Delta stands in for the source's infinite gap).

      One qualification, and it is the reason the word "exact" is not used for
      this entry as a whole. Corollary 1's two declarations assume ||v|| = 1 and
      ||vHat|| = 1, and the STANDALONE printed Corollary 1 does not say that: it
      writes only "if v, vHat in R^p satisfy Sigma v = lambda_j v and SigmaHat
      vHat = lambdaHat_j vHat". Unit vectors are unambiguously what is meant --
      the corollary is introduced as the d = 1 case of Theorem 2, whose V and
      VHat have orthonormal columns -- but the omission is not harmless: the
      second display is false as literally printed, and this repository carries a
      machine-checked refutation of it. `formalizes` is nevertheless the accurate
      relationship: what is written out is a hypothesis the source itself
      supplies one sentence earlier, not a change to the result. Theorem 2 needs
      no such qualification.

      The clause-by-clause basis is `registry/YWS_SOURCE_CONTRACT.md` in the
      repository.
    author_endorsement: "not-contacted"

status:
  scope: >-
    Compared by this Comparator configuration: Theorem 2, both printed
    conclusions, and Corollary 1, both printed displays, the latter with the unit
    normalization the standalone printed display omits written out. Not compared here, and
    not claimed by this entry: Theorem 1, Theorem 3, Appendix Lemma A1, the
    sharpness constructions and the three source-defect refutations, all of which
    are formalized in the repository. Theorem 3 is the subject of a separate
    Comparator configuration and a separate Palomar entry.

    Theorem 1 is deliberately not selected. Its printed mixed separation is an
    infimum over two exterior rays, and the published article defines those rays
    with lambda-hat_0 = -infinity and lambda-hat_{p+1} = +infinity, which makes
    the corresponding ray the whole line and the separation zero whenever the
    block touches either end of the spectrum -- including the top-d block, the
    common case in statistics. The repository records that reading and does not
    resolve it by assuming the opposite convention.

    The Challenge module carries the deliberate statement-side holes the
    Comparator convention requires; no library declaration is left incomplete.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - name: "YWSPalomar.theorem2_sinTheta"
      statement: >-
        Theorem 2, first conclusion: the Frobenius sin-Theta distance between the
        population and sample eigenspaces of the block r..s is at most
        2 min(sqrt(d) ||E||_op, ||E||_F) / Delta. The printed statement.
    - name: "YWSPalomar.theorem2_alignedFrame"
      statement: >-
        Theorem 2, second conclusion: some orthogonal d-by-d matrix O-hat
        satisfies ||V-hat O-hat - V||_F <= 2^(3/2) min(sqrt(d) ||E||_op, ||E||_F)
        / Delta, against the supplied population frame. The printed statement.
    - name: "YWSPalomar.corollary1_sinTheta"
      statement: >-
        Corollary 1, first display: the rank-one case, sin Theta(v-hat, v) <=
        2 ||E||_op / Delta_j with Delta_j the neighbouring population gap, with
        the unit normalization the standalone printed display omits made
        explicit.
    - name: "YWSPalomar.corollary1_alignedVector"
      statement: >-
        Corollary 1, second display: under the printed orientation condition
        <v-hat, v> >= 0, ||v-hat - v|| <= 2^(3/2) ||E||_op / Delta_j, with the
        unit normalization made explicit. Without it the printed display is
        false, and the repository refutes it.

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-opus-4-8"
        - "claude-fable-5"
      framework: "Claude Code"
      tool_setup: >-
        Agents worked directly in the repository with the Lean toolchain, running
        `lake build` and the repository's own gate suite. Model attribution is
        recorded per commit in Co-Authored-By trailers and per declaration in the
        Mathlib-style `Authors:` module headers, which are a provenance record and
        name the models that produced a file alongside the humans who directed it.
        They are deliberately not a claim of authorship in the `project.authors`
        sense: this metadata is the authorship record, models appear here under
        automation, and only people appear under `project.authors`. The
        authoritative repository also carries a measured token/turn ledger under
        `.llm_resource_tally/`, which is not extracted here; no quantity from it
        is restated in this file, because a number no reader of this repository can
        check is worse than no number.
    - method: "agent"
      models:
        - "gpt-5.6-terra"
        - "gpt-5.6-sol"
      framework: "OpenAI Codex CLI"
      tool_setup: >-
        A smaller share of the work was done by GPT-based agents under the OpenAI
        Codex CLI rather than under Claude Code. The authoritative repository's
        ledger distinguishes the two backends by name; the split is recorded there
        and is not restated as a figure here.
    - method: "manual"
      framework: "n/a"
      tool_setup: >-
        The human maintainer set scope and priorities, ran builds and audits,
        inspected theorem interfaces, adjudicated source-fidelity questions,
        accepted or rejected proposed repairs, and decided repository policy.
  spend_usd: "subscription-based; not tracked per commit"
  notes: >-
    This is a heavily agent-authored formalization with human direction and
    review. The Lean kernel is the proof checker. Mechanical checks do not
    establish that a Lean statement says what a paper says, which is why the
    selection rests on a clause-by-clause source contract rather than on
    declaration names.

fidelity:
  divergences: >-
    Theorem 2's two compared statements are the printed ones, with no added
    hypothesis and no weakened conclusion.

    Corollary 1's two compared statements add ||v|| = 1 and ||v-hat|| = 1, which
    the standalone printed display omits. The paper introduces Corollary 1 as the
    d = 1 case of Theorem 2, whose frames have orthonormal columns, so this is a
    hypothesis the source supplies one sentence earlier rather than a new one;
    but it cannot simply be dropped, because the second printed display is false
    without it. Scaling v-hat preserves every printed hypothesis -- the
    eigenvector equation is homogeneous and v-hat^T v >= 0 only becomes more true
    -- so with SigmaHat = Sigma and v-hat = 2v the perturbation is zero, the
    printed bound is 0, and ||v-hat - v|| = ||v||. That is machine-checked as
    `YuWangSamworth2015.corollary1_printed_unnormalized_counterexample`. The
    printed first display survives scaling, being about the angle between two
    spans, though it is degenerate at v-hat = 0, which the printed hypotheses
    also admit.

    Two further qualifications a reader should have. Lean indices are zero-based,
    so the paper's block 1 <= r <= s <= p appears as r <= s and s < p. And for
    the full block r = 1, s = p the paper's conventions lambda_0 = +infinity and
    lambda_{p+1} = -infinity make both exterior gaps infinite; the exact-gap
    predicate records that as a separate branch in which any positive finite
    Delta is accepted, which is sound because the selected frame then spans the
    whole space and the sine distance is zero. Outside that case the predicate
    identifies Delta with the printed minimum.

    Three defects in the printed paper are machine-checked or documented
    elsewhere in the repository and are not part of this entry: printed Equation
    (4) omits a square on the factor (2 - ||v-hat - v||^2) and is refuted as
    printed at inner product 3/5; Theorem 3's printed convention
    sigma^2_{rank(A)+1} := -infinity is false at the rank boundary, which the
    separate Theorem 3 entry discloses and which makes that entry an adaptation;
    and Theorem 1's printed conventions lambda-hat_0 = -infinity,
    lambda-hat_{p+1} = +infinity invert its exterior rays and make it vacuous at
    any block touching an end of the spectrum.

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >-
    No external peer review. What has happened: kernel verification of every
    claimed declaration by `lake build`; Comparator, the independent NanoDa
    kernel and Lean's own kernel accepting this entry, with axiom closure exactly
    propext, Quot.sound and Classical.choice; repeated adversarial source audits
    in the authoritative repository, several of which found real defects that are
    recorded in its census; and human coordinator review of scope, theorem
    interfaces and repair decisions.
