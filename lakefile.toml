name = "yws_2015_formalization"
version = "0.1.0"
defaultTargets = ["YuWangSamworth2015", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1b39d420ac84ed9a5a7d536ce19b37818ad29c39"

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "ForTauCeti"
globs = ["ForTauCeti.*"]
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

[[lean_lib]]
name = "DavisKahan"

[[lean_lib]]
name = "YuWangSamworth2015"
srcDir = "YuWangSamworth2015"
globs = ["YuWangSamworth2015.*"]
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# Internal Mathlib-only vocabulary module used by the root Solution.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar.*"]

# Standard Palomar root modules.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
