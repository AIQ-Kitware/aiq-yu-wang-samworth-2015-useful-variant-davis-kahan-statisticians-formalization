# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Palomar entry metadata for `registry/yws-rectangular/comparator.json`.
#
# One Palomar entry is one Comparator configuration. This file describes the
# rectangular Yu-Wang-Samworth selection -- Theorem 3 -- whose relationship to
# the source is `adapts`, because one printed convention of that theorem is false
# and is replaced. The symmetric Theorem 2 / Corollary 1 entry is source-faithful
# -- Theorem 2 exact, Corollary 1 with an inherited hypothesis made explicit --
# and carries its own metadata beside its own configuration.
version: "v0.4"

project:
  name: "Yu-Wang-Samworth 2015, Theorem 3: population-gap bounds for singular subspaces, with a corrected rank-boundary convention"
  description: >-
    A machine-checked formalization, in Lean 4, of Theorem 3 of Yi Yu, Tengyao
    Wang and Richard J. Samworth, "A useful variant of the Davis-Kahan theorem
    for statisticians" (Biometrika 102 (2015) 315-323), in a corrected form: one
    convention of the printed theorem is false, is refuted in the accompanying
    development, and is replaced here by the convention the paper's own proof
    uses.

    Theorem 3 carries the paper's population-gap idea from symmetric matrices to
    rectangular ones. For real p-by-q matrices A and A-hat with singular values
    sigma_1 >= sigma_2 >= ... and a block 1 <= r <= s <= rank(A) of singular
    indices, with d = s - r + 1, D = A-hat - A, and the squared population
    singular gap Delta = min(sigma^2_{r-1} - sigma^2_r, sigma^2_s -
    sigma^2_{s+1}), the Frobenius sin-Theta distance between the corresponding
    right singular subspaces is at most 2 (2 sigma_1 + ||D||_op) min(sqrt(d)
    ||D||_op, ||D||_F) / Delta, and some orthogonal d-by-d matrix O-hat satisfies
    ||V-hat O-hat - V||_F <= 2^(3/2) times the same quantity, compared against
    the supplied population frame. The same two bounds hold for the left singular
    blocks. This is the population-gap counterpart of Wedin's generalized
    sin-theta theorem: as in Theorem 2, every separation hypothesis involves only
    the population object A, so no singular-value gap is assumed for A-hat and
    the statements quantify over every admissible orthonormal singular frame at
    the block, including under multiplicity.

    THE CORRECTION. The paper prints the conventions sigma^2_0 := +infinity and
    sigma^2_{rank(A)+1} := -infinity. The second is false. It makes the
    denominator infinite whenever the block ends at rank(A), so the printed bound
    asserts that the sample and population singular subspaces coincide -- and
    they need not: taking A and A-hat to be the orthogonal projections of the
    plane onto the two coordinate axes, both have rank one, so r = s = 1 =
    rank(A) satisfies the printed hypothesis, yet the two right singular
    subspaces are orthogonal and the Frobenius sin-Theta norm is 1. The
    accompanying development carries that counterexample as a compiled
    refutation. The corrected convention is the ambient one the paper's own proof
    uses: that proof passes to A^T A, whose eigenvalues are sigma^2_1 >= ... >=
    sigma^2_q at the ambient dimension q, and applies Theorem 2, whose convention
    is lambda_{q+1} := -infinity. So the right blocks read the convention at q
    and the left blocks at p, with sigma_j = 0 past the rank; where the block
    ends at the rank, the correct lower boundary gap is the finite sigma^2_s - 0,
    which the caller must supply, in place of the vacuous one the printed
    convention offered. The compared statements use that reading and do not
    reintroduce sigma^2_{rank(A)+1} := -infinity anywhere.

    THE SOURCE BLOCK RESTRICTION IS KEPT. The paper's own condition 1 <= r <= s
    <= rank(A) is a separate matter from the endpoint convention, and it is
    retained, as s < finrank (range A) in zero-based form. Everything else about
    the index range follows from it rather than being assumed: s < q, s < p,
    q > 0 and p > 0 are all consequences. The accompanying development also
    proves the corresponding statements without the rank restriction, which is a
    valid generalization; this entry deliberately compares the statements at the
    paper's scope instead.

    Delta is identified with the corrected minimum rather than merely bounded
    below by it. Where a selected block fills the whole ambient space -- which,
    under the source rank condition, forces A to have full column rank on the
    right or full row rank on the left -- both source boundaries are infinite and
    no greatest finite real satisfies the boundary clauses; that case is an
    explicit branch, sound because the selected frame then spans everything and
    the sine distance is zero. Nothing here claims that a finite Delta is
    infinite.

    Two further declarations are compared, one for the right blocks and one for
    the left, establishing that the Gram-eigenvector form used in the statements
    -- A^T A v_i = sigma_i^2 v_i -- is equivalent, at the indices the source rank
    condition selects, to the paper's printed pair of singular-vector equations
    A v_j = sigma_j u_j and A^T u_j = sigma_j v_j. That equivalence is proved
    rather than asserted.

    The wider development from which this entry is extracted also formalizes the
    paper's Theorem 1, Theorem 2, Corollary 1 and Appendix Lemma A1, both Section
    2 sharpness constructions, the Section 1 numerical illustration and the
    deterministic content of the Section 3 audit, and machine-checks a second
    printed defect, in Equation (4). Theorem 2 and Corollary 1 are a separate
    Palomar entry, with its own metadata, and are source-faithful: Theorem 2 is
    exact, and Corollary 1 makes explicit the unit normalization inherited from
    its d = 1 derivation from Theorem 2, which the standalone printed display
    omits.
  authors:
    - "Jon Crall"
    - "Edward Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jon Crall"

classification:
  arxiv: ["math.ST", "math.FA"]
  msc2020:
    - "15A42"   # Inequalities involving eigenvalues and singular values
    - "15A18"   # Eigenvalues, singular values, and eigenvectors
    - "47A55"   # Perturbation theory of linear operators
    - "62H25"   # Factor analysis, principal components, correspondence analysis
    - "65F15"   # Numerical computation of eigenvalues and eigenvectors

sources:
  - title: "A useful variant of the Davis-Kahan theorem for statisticians"
    authors: ["Yi Yu", "Tengyao Wang", "Richard J. Samworth"]
    id: "doi:10.1093/biomet/asv008"
    type: "paper"
    location: "Biometrika 102(2), 2015, 315-323"
    relationship: "adapts"
    note: >-
      Published Biometrika numbering. The relationship is `adapts`, not
      `formalizes`, and the difference is exactly this: Theorem 3 as printed
      declares sigma^2_{rank(A)+1} := -infinity, which is false at the rank
      boundary. A compiled counterexample in the accompanying development
      satisfies the printed hypotheses and contradicts the printed conclusion
      (two rank-one orthogonal projections of the plane, Frobenius sin-Theta norm
      1). The compared statements therefore use the ambient Gram-spectrum
      convention the paper's own proof dictates, passing through A^T A and A A^T,
      with the convention read at the ambient dimension q on the right and p on
      the left and with singular values zero past the rank. The paper's own block
      restriction 1 <= r <= s <= rank(A) is nevertheless retained, in its
      zero-based form. Everything else in the compared statements -- the
      arbitrary supplied singular frames, the absence of any sample
      singular-value gap, the numerator (2 sigma_1 + ||D||_op) min(sqrt(d)
      ||D||_op, ||D||_F), and the constants 2 and 2^(3/2) -- is the printed
      content. This entry must not be described as exact. The clause-by-clause
      basis is `registry/YWS_SOURCE_CONTRACT.md` in the repository.
    author_endorsement: "not-contacted"

status:
  scope: >-
    Compared by this Comparator configuration: Theorem 3 for right and left
    singular subspaces, sine and aligned-frame conclusions, in the corrected form
    described above; and the two equivalences between the Gram-eigenvector form
    of a singular block and the paper's printed singular-vector equations. Not
    compared here, and not claimed by this entry: Theorem 1, Theorem 2, Corollary
    1, Appendix Lemma A1, the sharpness constructions and the three source-defect
    refutations, all of which are formalized in the repository. Theorem 2 and
    Corollary 1 are the subject of a separate Comparator configuration and a
    separate Palomar entry.

    The Challenge module carries the deliberate statement-side holes the
    Comparator convention requires; no library declaration is left incomplete.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - name: "YWSRectangular.theorem3_rightSinTheta"
      statement: >-
        Theorem 3, right singular subspaces, sine conclusion, at the source block
        1 <= r <= s <= rank(A), with the rank-boundary convention corrected from
        sigma^2_{rank(A)+1} to the ambient singular-value sequence. Not the
        literal printed statement, which is false; see the source note.
    - name: "YWSRectangular.theorem3_rightAlignedFrame"
      statement: >-
        Theorem 3, right singular subspaces, aligned-frame conclusion, same scope
        and same correction.
    - name: "YWSRectangular.theorem3_leftSinTheta"
      statement: >-
        Theorem 3, left singular subspaces, sine conclusion, same scope and same
        correction, with the ambient convention read at p.
    - name: "YWSRectangular.theorem3_leftAlignedFrame"
      statement: >-
        Theorem 3, left singular subspaces, aligned-frame conclusion, same scope
        and same correction.
    - name: "YWSRectangular.isRightSingularBlock_iff_pairedSingularVectors"
      statement: >-
        At the indices the source rank condition selects, the Gram-eigenvector
        form A^T A v_i = sigma_i^2 v_i used in the statements above is equivalent
        to the paper's printed pair A v_j = sigma_j u_j, A^T u_j = sigma_j v_j
        with an orthonormal family of left singular vectors.
    - name: "YWSRectangular.isLeftSingularBlock_iff_pairedSingularVectors"
      statement: >-
        The same equivalence for left singular blocks.

