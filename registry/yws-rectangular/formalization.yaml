    This is a heavily agent-authored formalization with human direction and
    review. The Lean kernel is the proof checker. Mechanical checks do not
    establish that a Lean statement says what a paper says, which is why the
    selection rests on a clause-by-clause source contract rather than on
    declaration names.

fidelity:
  divergences: >-
    One, and it is the reason this entry's source relationship is `adapts`.
    Theorem 3's printed convention sigma^2_{rank(A)+1} := -infinity makes the
    denominator infinite when the block ends at rank(A), so the printed bound
    asserts that two singular subspaces which can be orthogonal coincide. It is
    refuted in the accompanying development by two rank-one orthogonal
    projections of the plane, for which the Frobenius sin-Theta norm is 1. The
    compared statements use the ambient-index convention the paper's own proof
    uses, with singular values zero past the rank. The paper's block restriction
    1 <= r <= s <= rank(A) is retained.

    Two qualifications a reader should have. Lean indices are zero-based, so the
    paper's 1 <= r <= s <= rank(A) appears as r <= s together with
    s < finrank (range A). And for a block filling the whole ambient space both
    source boundaries are infinite; the exact-gap predicate records that as a
    separate branch in which any positive finite Delta is accepted, which is
    sound because the selected frame then spans everything and the sine distance
    is zero.

    Three further defects in the printed paper, unrelated to this entry, are
    machine-checked or documented elsewhere in the repository: printed Equation
    (4) omits a square on the factor (2 - ||v-hat - v||^2) and is refuted as
    printed at inner product 3/5; the standalone printed Corollary 1 omits the
    unit normalization its own d = 1 reading supplies, without which its second
    display is false, and that too is refuted; and Theorem 1's printed
    conventions lambda-hat_0 = -infinity, lambda-hat_{p+1} = +infinity invert its
    exterior rays and make it vacuous at any block touching an end of the
    spectrum.

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >-
    No external peer review. What has happened: kernel verification of every
    claimed declaration by `lake build`; Comparator, the independent NanoDa
    kernel and Lean's own kernel accepting this entry, with axiom closure exactly
    propext, Quot.sound and Classical.choice; repeated adversarial source audits
    in the authoritative repository, several of which found real defects that are
    recorded in its census -- including, in the pass that produced this entry,
    that the aligned-frame conclusion was not stated in the shape the paper
    prints, that the source rank restriction had been dropped, and that the
    denominator was a lower bound rather than the printed minimum; and human
    coordinator review of scope, theorem interfaces and repair decisions.
