# Thin-wrapper metadata for the Yu-Wang-Samworth Palomar entry.
#
# Before submitting, replace 09cdd30aeec523533abffc6d553196912c6be6ec in BOTH this file and
# lakefile.toml with the same full 40-character lowercase commit of the
# substantive repository that the entry was verified against.
version: v0.4
project:
  name: 'Yu-Wang-Samworth 2015: the population-gap sin-Theta theorem'
  description: 'A machine-checked proof of the first conclusion of Theorem 2 of Yu, Wang and
    Samworth''s variant of the Davis-Kahan theorem: for a symmetric operator T on a finite-dimensional
    real or complex inner product space, a symmetric perturbation S, and a set s of eigenvalue
    indices whose selected eigenvalues are separated from the unselected ones by at least
    Delta > 0, the Frobenius norm of sin Theta between the corresponding eigenspaces is at
    most 2 |S - T|_F / Delta. The separation is taken entirely within the population spectrum
    of T, which is what distinguishes this variant from the classical bound and what makes
    it usable in statistics: the classical gap involves the unobserved sample eigenvalues.
    This repository is a thin Comparator wrapper; the proof lives in the substantive formalization
    pinned below.'
  authors:
  - Jon Crall
  - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
  - Jon Crall
repository:
  substantive_formalization:
    id: AIQ-Kitware/aiq-dkps-formalization
    revision: 09cdd30aeec523533abffc6d553196912c6be6ec
classification:
