    prompting_notes: 'Work was directed by task, not by prompt template: a scope decision
      from the maintainer, then autonomous proof and audit work against the source census.
      Adversarial review prompts are part of the audit record in the authoritative repository.'
  - method: manual
    framework: n/a
    tool_setup: The human maintainer set scope and priorities, ran builds and audits, inspected
      theorem interfaces, adjudicated source-fidelity questions, accepted or rejected proposed
      repairs, and decided repository policy.
  spend_usd: subscription-based; not tracked
  notes: This is a heavily agent-authored formalization with human direction and review. The
    Lean kernel is the proof checker. Mechanical checks do not establish that a Lean statement
    says what a paper says, which is why the selection here rests on a clause-by-clause source
    contract rather than on declaration names.
fidelity:
  divergences: 'Two defects in the printed paper, both machine-checked rather than concealed.
    (1) Printed Equation (4): the rewrite of sin^2(2 theta) in terms of |v-hat - v|^2 omits a
    square on the factor (2 - |v-hat - v|^2). The corrected identity is proved and the printed
    polynomial is refuted at inner product 3/5. Not part of any compared entry. (2) Theorem 3''s
    printed convention sigma^2_{rank(A)+1} := -infinity makes the denominator infinite when the
    block ends at rank(A), so the printed bound asserts that two singular subspaces which can be
    orthogonal coincide; refuted by two rank-one orthogonal projections of the plane, for which
    the sin-Theta Frobenius norm is 1. The compared Theorem 3 statements use the ambient-index
    convention the paper''s own proof uses, with singular values zero past the rank. The
    yws-rectangular entry is therefore source-corrected, not exact. Beyond these, the compared
    Theorem 2 and Corollary 1 statements are the printed ones, with no added hypothesis and no
    weakened conclusion; in particular no sample eigengap is introduced and the sample eigenframe
    is an arbitrary admissible one.'
review:
  status: self-assessed
  reviewers:
  - Jon Crall
  notes: 'No external peer review. What has happened: kernel verification of every claimed
    declaration by `lake build`; Comparator, the independent NanoDa kernel and Lean''s own kernel
    accepting both entries, with axiom closure exactly propext, Quot.sound and Classical.choice;
    repeated adversarial source audits in the authoritative repository, several of which found
    real defects that are recorded in its census -- including, in the pass that produced these
    entries, that Theorem 3''s aligned-frame conclusion was not stated in the shape the paper
    prints; and human coordinator review of scope, theorem interfaces and repair decisions.'
