# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
#
# Metadata for the Yu-Wang-Samworth 2015 extraction.
#
# This repository carries the proof. It is an extraction of the corresponding
# packages from AIQ-Kitware/aiq-dkps-formalization, which remains authoritative;
# see README.md for what that means for updates.
version: v0.4
project:
  name: 'Yu-Wang-Samworth 2015: the population-gap Davis-Kahan theorems'
  description: 'A machine-checked formalization of every numbered result of Yu, Wang and
    Samworth''s variant of the Davis-Kahan theorem for statisticians: Theorem 1, both conclusions
    of Theorem 2, both displays of Corollary 1, Theorem 3 for right and left singular subspaces,
    and Appendix Lemma A1. The paper''s contribution is that the eigenvalue separation in a
    sin-Theta bound may be taken entirely inside the population spectrum, rather than between
    the population eigenvalues and the unobserved sample ones; the classical separation can
    vanish while the population spectrum is well separated, and the paper gives an explicit
    five-by-five example where it does. No sample eigengap is assumed anywhere, so the sample
    operator may have a repeated eigenvalue at the selected block and the theorems quantify
    over every admissible orthonormal sample eigenframe rather than over one chosen eigenbasis;
    a repository witness exhibits a sample operator for which every unit vector of the plane
    is admissible. Two defects in the printed paper are machine-checked rather than concealed:
    printed Equation (4) omits a square and is refuted as printed, and Theorem 3''s printed
    convention sigma^2_{rank(A)+1} := -infinity is false at the rank boundary and is replaced
    by the ambient-index convention the paper''s own proof uses.'
  authors:
  - Jon Crall
  - Edward Wang
  license: Apache-2.0
  responsible_maintainers:
  - Jon Crall
repository:
  role: substantive-development
classification:
  arxiv:
  - math.ST
  - math.FA
  msc2020:
  - 62H25
  - 47A55
  - 15A42
  - 65F15
sources:
- title: A useful variant of the Davis-Kahan theorem for statisticians
  authors:
  - Yi Yu
  - Tengyao Wang
  - Richard J. Samworth
  id: doi:10.1093/biomet/asv008
  type: article
  location: Biometrika 102(2), 2015, 315-323
  relationship: formalizes
  note: 'Published Biometrika numbering. Compared declarations and their exact source alignment
    are listed under status.main_results below; the clause-by-clause basis is
    palomar/YWS_SOURCE_CONTRACT.md. Theorem 2 and Corollary 1 are formalized and compared at
    the printed statement with no added hypothesis and no weakened conclusion. Theorem 3 is
    compared in a corrected form: its printed rank-boundary convention is false and is refuted
    in this repository, and the statements use the ambient-index convention the paper''s proof
    requires. Theorem 1 and Appendix Lemma A1 are formalized here but are not compared by any
    Comparator entry.'
  author_endorsement: not-contacted
status:
  scope: 'Formalized in this repository: every numbered result of the paper -- Theorem 1, both
    conclusions of Theorem 2, both displays of Corollary 1, Theorem 3 for right and left singular
    subspaces with sine and aligned-frame conclusions, and Appendix Lemma A1 -- together with
    the Section 1 numerical illustration, both Section 2 sharpness constructions, the deterministic
    content of the Section 3 audit, and the two source-defect refutations. Compared by Comparator:
    Theorem 2 and Corollary 1 (palomar/yws-symmetric, exact) and Theorem 3 (palomar/yws-rectangular,
    source-corrected). Not compared: Theorem 1, Appendix Lemma A1, the sharpness material and
    the refutations. Theorem 1 is withheld from comparison because writing its printed mixed
    separation exactly turns on the paper''s endpoint conventions for the sample spectrum, which
    as transcribed make the theorem vacuous at any block touching either end of the spectrum;
    that question is recorded in palomar/YWS_SOURCE_CONTRACT.md and is unresolved. The Challenge
    modules carry the deliberate statement-side holes the Comparator convention requires; no
    library declaration is left incomplete. The source census and audit machinery are not
    extracted here, so this repository makes no coverage claim beyond what is listed.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
  - name: YWSPalomar.theorem2_sinTheta
    statement: 'Theorem 2, first conclusion: the Frobenius sin-Theta distance between the population
      and sample eigenspaces of a block is at most 2 min(sqrt d |E|_op, |E|_F) / Delta, where
      Delta is the population boundary gap of the block. Exact.'
  - name: YWSPalomar.theorem2_alignedFrame
    statement: 'Theorem 2, second conclusion: some orthogonal d-by-d matrix O-hat satisfies
      |V-hat O-hat - V|_F <= 2^(3/2) min(sqrt d |E|_op, |E|_F) / Delta, against the supplied
      population frame. Exact.'
  - name: YWSPalomar.corollary1_sinTheta
    statement: 'Corollary 1, first display: the rank-one case, sin Theta(v-hat, v) <= 2 |E|_op
      / Delta_j with Delta_j the neighbouring population gap. Exact.'
  - name: YWSPalomar.corollary1_alignedVector
    statement: 'Corollary 1, second display: under the printed orientation condition, |v-hat
      - v| <= 2^(3/2) |E|_op / Delta_j. Exact.'
  - name: YWSRectangular.theorem3_rightSinTheta
    statement: 'Theorem 3, right singular subspaces, sine conclusion, with the rank-boundary
      convention CORRECTED from sigma^2_{rank(A)+1} to the ambient singular-value sequence.
      Not the literal printed statement, which is false; see the source note.'
  - name: YWSRectangular.theorem3_rightAlignedFrame
    statement: 'Theorem 3, right singular subspaces, aligned-frame conclusion, same correction.'
  - name: YWSRectangular.theorem3_leftSinTheta
    statement: 'Theorem 3, left singular subspaces, sine conclusion, same correction.'
  - name: YWSRectangular.theorem3_leftAlignedFrame
    statement: 'Theorem 3, left singular subspaces, aligned-frame conclusion, same correction.'
