fidelity:
  divergences: >-
    The combined selection has two disclosed source qualifications.

    First, the standalone printed Corollary 1 omits the unit normalization that
    its introduction as the d=1 case of Theorem 2 supplies. The second display
    is false without it: with SigmaHat = Sigma and vHat = 2v, the homogeneous
    eigenvector equations and orientation condition hold while the perturbation
    is zero and ||vHat-v|| is not. The compared statements write the inherited
    normalization explicitly.

    Second, Theorem 3's printed convention sigma^2_(rank(A)+1) := -infinity is
    false at a rank boundary. It makes the denominator infinite and can force a
    zero bound for orthogonal singular subspaces. The compared statements use
    the ambient Gram-spectrum convention employed by the paper's proof, with
    singular values zero past rank, while retaining 1 <= r <= s <= rank(A).

    Two additional printed defects are formalized elsewhere but not selected:
    Equation (4) omits a square, and Theorem 1's sample endpoint conventions
    invert its exterior rays and make its positive-separation hypothesis
    impossible at end blocks. Theorem 2 itself is selected at the printed
    statement with no added sample-gap hypothesis and no weakened conclusion.

review:
  status: "self-assessed"
  reviewers:
    - "Jon Crall"
  notes: >-
    No external peer review. Local preparation has included Lean kernel builds,
    Comparator, NanoDa replay, and repeated adversarial source audits. Earlier
    audits found and corrected material presentation mismatches, including the
    Theorem 3 source rank restriction, exact-denominator requirement and
    aligned-frame shape. The merged root layout must be re-run through the same
    mechanical suite before submission because changing module composition can
    affect Comparator even when theorem types are unchanged.
