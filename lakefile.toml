name = "yws_2015_formalization"
version = "0.1.0"
# The default build is the mathematics. The Palomar entries are built explicitly
# with `lake build Palomar`, because their Challenge modules carry the deliberate
# statement-side holes the Comparator convention requires.
defaultTargets = ["YuWangSamworth2015"]

[leanOptions]
pp.unicode.fun = true
# Avoid accidental free variables in theorem statements.
autoImplicit = false

# Tau Ceti, pinned. `ForTauCeti` below is the reusable-mathematics package whose
# declarations already carry their final `TauCeti.*` namespaces; this dependency is
# the released upstream it is written against.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1b39d420ac84ed9a5a7d536ce19b37818ad29c39"

# Keep Mathlib last so this workspace owns the pin used by every library here and
# by the Tau Ceti checkout. The revision is the one the extraction was verified at
# and is recorded in `lake-manifest.json`.
[[require]]
name = "mathlib"
scope = "leanprover-community"

# The reusable-mathematics layer. A ForTauCeti module imports only `Mathlib.*`,
# `TauCeti.*` and `ForTauCeti.*`. The option set mirrors the one Tau Ceti applies to
# its own libraries, so a warning here is a warning upstream would see too.
[[lean_lib]]
name = "ForTauCeti"
globs = ["ForTauCeti.*"]
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# The Davis--Kahan development.
[[lean_lib]]
name = "DavisKahan"

# The Yu--Wang--Samworth development.
[[lean_lib]]
name = "YuWangSamworth2015"
srcDir = "YuWangSamworth2015"
globs = ["YuWangSamworth2015.*"]
leanOptions = { warningAsError = true, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, weak.linter.style.header = false }

# The Palomar entries. Each `Challenge` states its theorems against Mathlib alone
# and contains deliberate statement-side holes; each `Solution` supplies the same
# declarations from the libraries above. Comparator checks that the two agree.
# Intentionally not a default target: the Challenge modules contain holes.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar.*"]
