# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: "Yu-Wang-Samworth 2015: population-gap eigenspace and singular-subspace perturbation bounds"
  description: >-
    A machine-checked Lean 4 formalization of the principal population-gap
    perturbation results of Yi Yu, Tengyao Wang and Richard J. Samworth, "A
    useful variant of the Davis-Kahan theorem for statisticians" (Biometrika
    102 (2015) 315-323). This single Palomar entry compares both conclusions of
    Theorem 2 and both displays of Corollary 1 for eigenspaces of real symmetric
    matrices, together with the right- and left-singular-subspace conclusions of
    Theorem 3 for general real matrices and two supporting equivalences between
    its Gram-eigenvector formulation and the paper's paired singular-vector
    equations.

    The common idea is that every separation hypothesis in Theorems 2 and 3 is
    stated entirely in terms of the population object. Theorem 2 uses the
    population eigenvalue gap
    min(lambda_(r-1)-lambda_r, lambda_s-lambda_(s+1)); Theorem 3 applies the
    same idea to the squared singular spectrum, with the additional factor
    (2 sigma_1 + ||A-hat-A||_op). No sample eigenvalue or singular-value gap is
    assumed, so the sample frame is arbitrary among admissible orthonormal
    frames at the selected block, including under multiplicity.

    The selected results have deliberately different source dispositions.
    Theorem 2 is source-exact. Corollary 1 writes out the unit normalization
    inherited from its introduction as the d=1 case of Theorem 2; the standalone
    printed display omits that normalization and its second conclusion is false
    without it. Theorem 3 is source-corrected: its printed convention
    sigma^2_(rank(A)+1) := -infinity makes the denominator infinite at a rank
    boundary and yields a false assertion. The compared statement instead uses
    the ambient Gram-spectrum convention used by the paper's own proof, with
    singular values zero past rank, while retaining the printed restriction
    1 <= r <= s <= rank(A). Because this one entry contains that correction, its
    source relationship is conservatively recorded as `adapts`.
  authors:
    - "Jon Crall"
    - "Edward Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jon Crall"

classification:
  arxiv: ["math.ST", "math.FA"]
  msc2020:
    - "62H25"
    - "47A55"
    - "15A42"
    - "15A18"
    - "65F15"

sources:
  - title: "A useful variant of the Davis-Kahan theorem for statisticians"
    authors: ["Yi Yu", "Tengyao Wang", "Richard J. Samworth"]
    id: "doi:10.1093/biomet/asv008"
    type: "paper"
    location: "Biometrika 102(2), 2015, 315-323"
    relationship: "adapts"
    note: >-
      Published Biometrika numbering. The single relationship is `adapts`
      because one selected family, Theorem 3, corrects a false printed endpoint
      convention. The selection is otherwise more specific: Theorem 2's two
      conclusions are compared at the printed statement; Corollary 1's two
      displays make explicit the unit normalization inherited from their d=1
      derivation from Theorem 2; and Theorem 3 keeps the paper's block condition
      but replaces sigma^2_(rank(A)+1) := -infinity by the ambient Gram-spectrum
      convention required by the paper's own proof. The clause-by-clause basis for the merged selection is
      `registry/YWS_SOURCE_CONTRACT.md`.
    author_endorsement: "not-contacted"

status:
  scope: >-
    Compared by the root `comparator.json`: Theorem 2, both conclusions;
    Corollary 1, both displays with inherited unit normalization explicit;
    corrected Theorem 3 for right and left singular subspaces, sine and
    aligned-frame conclusions; and the two equivalences showing that the Gram
    formulation of a source-selected singular block agrees with the paper's
    paired singular-vector equations.

    Formalized in the wider repository but not selected by this Comparator:
    Theorem 1, Appendix Lemma A1, the Section 1 numerical illustration, the
    Section 2 sharpness constructions, the deterministic Section 3 audit, and
    the source-defect counterexamples. Theorem 1 is not selected because its
    printed sample endpoint conventions make its printed mixed separation zero
    at any block touching an endpoint; the Lean development instead uses an
    intrinsic spectral separation and does not claim to reproduce that printed
    delta.

    `Challenge.lean` imports Mathlib alone. Its deliberate `sorry` terms are the
    statement-side holes required by Comparator; no substantive library
    declaration is left incomplete.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - name: "YWSPalomar.theorem2_sinTheta"
      statement: >-
        Theorem 2, first conclusion: the Frobenius sin-Theta distance between
        population and sample eigenspaces is at most
        2 min(sqrt(d)||E||_op,||E||_F)/Delta for the exact population boundary
        gap Delta, with no sample eigengap.
    - name: "YWSPalomar.theorem2_alignedFrame"
      statement: >-
        Theorem 2, second conclusion: an orthogonal block rotation aligns the
        supplied sample frame to the supplied population frame within
        2^(3/2) min(sqrt(d)||E||_op,||E||_F)/Delta.
    - name: "YWSPalomar.corollary1_sinTheta"
      statement: >-
        Corollary 1, first display, with the unit normalization inherited from
        its d=1 derivation from Theorem 2 made explicit.
    - name: "YWSPalomar.corollary1_alignedVector"
      statement: >-
        Corollary 1, second display under the printed orientation condition,
        with the inherited unit normalization explicit; without normalization
        the standalone printed display is false.
    - name: "YWSRectangular.theorem3_rightSinTheta"
      statement: >-
        Corrected Theorem 3, right singular subspaces, sine conclusion, at the
        printed block 1 <= r <= s <= rank(A), using the ambient singular-value
        endpoint convention instead of the false printed rank-boundary one.
    - name: "YWSRectangular.theorem3_rightAlignedFrame"
      statement: >-
        Corrected Theorem 3, right singular subspaces, aligned-frame conclusion,
        with the same source block restriction and endpoint correction.
    - name: "YWSRectangular.theorem3_leftSinTheta"
      statement: >-
        Corrected Theorem 3, left singular subspaces, sine conclusion, with the
        ambient convention read in the left Gram spectrum.
    - name: "YWSRectangular.theorem3_leftAlignedFrame"
      statement: >-
        Corrected Theorem 3, left singular subspaces, aligned-frame conclusion.
    - name: "YWSRectangular.isRightSingularBlock_iff_pairedSingularVectors"
      statement: >-
        At the positive singular values selected by the paper's rank condition,
        the right Gram-eigenvector formulation is equivalent to the paper's
        paired singular-vector equations.
    - name: "YWSRectangular.isLeftSingularBlock_iff_pairedSingularVectors"
      statement: >-
        The corresponding equivalence for left singular blocks.

